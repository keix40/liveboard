# Render Blueprint for the LiveBoard sync server.
# Render looks for render.yaml at the repo root by default. When creating the
# Blueprint in the dashboard, set "Blueprint Path" to apps/server/render.yaml.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: liveboard-sync
    runtime: node
    plan: 0.5c-512mb         # paid instance: `free` spins down when idle, which drops every socket
    region: singapore
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@liveboard/server
    startCommand: node apps/server/dist/index.js
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - apps/server/**
        - packages/shared/**
        - pnpm-lock.yaml
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: LIVEBOARD_JWT_SECRET
        sync: false          # set in the dashboard; must match the Vercel value
      - key: ALLOWED_ORIGINS
        sync: false          # e.g. https://liveboard.vercel.app
      - key: PERSISTENCE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: liveboard-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: liveboard-kv
          property: connectionString
      - key: COMPACT_EVERY_N_UPDATES
        value: "500"

  - type: keyvalue
    name: liveboard-kv
    plan: 256mb
    region: singapore
    ipAllowList: []          # only reachable from services in the same Render account/region

databases:
  - name: liveboard-db
    # plan omitted -> Render's default Postgres compute plan
    region: singapore
    databaseName: liveboard
    user: liveboard
