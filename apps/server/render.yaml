# Render Blueprint for the LiveBoard sync server.
# In the Render dashboard, set "Blueprint Path" to apps/server/render.yaml.
# Default: free web service + in-memory persistence (no Postgres/Redis bill).
# Upgrade path: set PERSISTENCE=postgres, attach DATABASE_URL, optional REDIS_URL — see README.
services:
  - type: web
    name: liveboard-sync
    runtime: node
    plan: free
    region: singapore
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@liveboard/server
    startCommand: node apps/server/dist/index.js
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - apps/server/**
        - packages/shared/**
        - pnpm-lock.yaml
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: LIVEBOARD_JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PERSISTENCE
        value: memory
      - key: COMPACT_EVERY_N_UPDATES
        value: "500"

